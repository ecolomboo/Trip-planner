# Supabase free projects pause automatically after 7 days without database
# activity. A trivial `SELECT 1` every 3 days keeps ours alive through the
# trip, so we never open the app to a paused project mid-desert.
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 0 */3 * *" # every 3 days at midnight UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ping Supabase Postgres
        run: node scripts/keep-alive.mjs
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
